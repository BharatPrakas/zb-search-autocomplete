<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenBasket Search Autocomplete - Demo</title>
  <link rel="stylesheet" href="./src/index.css" />
  <script type="module" src="/src/zb-search-modern.ts"></script>
  <script type="module" src="/src/zb-search-autocomplete.ts"></script>
  <script type="module" src="/src/zb-classic-search.ts"></script>
  <style>
    .demo-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .demo-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #333;
    }

    .demo-header p {
      color: #666;
      font-size: 16px;
    }

    .demo-section {
      margin-bottom: 40px;
    }

    .demo-section h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #333;
    }

    .code-block {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 16px;
      margin-top: 16px;
      overflow-x: auto;
    }

    .code-block pre {
      margin: 0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #333;
    }

    .event-log {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 16px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .event-log-item {
      padding: 4px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .event-log-item:last-child {
      border-bottom: none;
    }

    .event-time {
      color: #999;
      margin-right: 8px;
    }

    .event-name {
      color: #0066cc;
      font-weight: 600;
      margin-right: 8px;
    }

    .event-detail {
      color: #666;
    }
  </style>
</head>

<body style="background-color: #f5f5f5;">

  <div class="demo-container">
    <div class="demo-header">
      <h1>🔍 ZenBasket Search Autocomplete</h1>
      <p>A reusable web component for product search with autocomplete</p>
    </div>

    <div class="demo-section">
      <h2>Modern Search Autocomplete</h2>
      <zb-search-modern id="search-modern" placeholder="Search products, pages..."></zb-search-modern>
    </div>

    <div class="demo-section">
      <h2>Search Autocomplete</h2>
      <zb-search-autocomplete id="search-autocomplete" placeholder="Search products, pages..."></zb-search-autocomplete>
    </div>

    <div class="demo-section">
      <h2>Classic Search (Default)</h2>
      <zb-classic-search id="classic-search" placeholder="Search products..."></zb-classic-search>
    </div>

    <div class="demo-section">
      <h2>Classic Search (List Only)</h2>
      <zb-classic-search id="classic-search-list" placeholder="Search products..." dropdown-style="list-only"></zb-classic-search>
    </div>
    
    <div class="demo-section">
        <h3>Events Log</h3>
        <div id="eventLog" class="event-log">
            <div style="color: #999; font-style: italic;">Events will appear here...</div>
        </div>
    </div>
  </div>

  <script>
    // Demo script to simulate search functionality
    const eventLog = document.getElementById('eventLog');

    function logEvent(source, eventName, detail) {
      if (!eventLog) return;
      const time = new Date().toLocaleTimeString();
      const logItem = document.createElement('div');
      logItem.className = 'event-log-item';
      logItem.innerHTML = `
          <span class="event-time">${time}</span>
          <span class="event-name">[${source}] ${eventName}</span>
          <span class="event-detail">${JSON.stringify(detail)}</span>
        `;

      if (eventLog.children.length === 1 && eventLog.children[0].style.fontStyle === 'italic') {
        eventLog.innerHTML = '';
      }

      eventLog.insertBefore(logItem, eventLog.firstChild);

      while (eventLog.children.length > 20) {
        eventLog.removeChild(eventLog.lastChild);
      }
    }

    const componentIds = ['search-modern', 'search-autocomplete', 'classic-search', 'classic-search-list'];

    componentIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        el.addEventListener('search-input', (e) => {
            logEvent(id, 'search-input', e.detail);

            // Simulate API call
            setTimeout(() => {
                const query = e.detail.query.toLowerCase();
                const mockData = {
                    suggestions: [
                        { name: `${query} in Electronics`, url: '/category/electronics' },
                        { name: `${query} shoes`, url: '/category/shoes' },
                        { name: `Best ${query}`, url: '/search?q=best+' + query }
                    ],
                    products: [
                        { name: `Premium ${query}`, url: '/product/1', image: 'https://placehold.co/100x100?text=Product' },
                        { name: `${query} Pro`, url: '/product/2', image: 'https://placehold.co/100x100?text=Pro' }
                    ]
                };
                
                // For zb-classic-search we might need to set results directly if it doesn't support the event yet in the demo logic, 
                // but let's try dispatching the response event which is the standard way.
                const responseEvent = new CustomEvent('zb-search-response', {
                    detail: mockData,
                    bubbles: true,
                    composed: true
                });
                el.dispatchEvent(responseEvent);
                
                // Fallback for older components if they have setResults method
                if (typeof el.setResults === 'function') {
                    el.setResults(mockData);
                }
            }, 500);
        });
        
        el.addEventListener('search-selection', (e) => logEvent(id, 'search-selection', e.detail));
        el.addEventListener('search-submit', (e) => logEvent(id, 'search-submit', e.detail));
        el.addEventListener('search-clear', () => logEvent(id, 'search-clear', {}));
        el.addEventListener('search-close', () => logEvent(id, 'search-close', {}));
    });
  </script>



</html>
